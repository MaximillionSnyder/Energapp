name: Android

# La APK oficial se compila SOLO aquí, nunca en local.
#
# - Tag v*: compila el release (R8 + firmado) y publica una Release de GitHub
#   con la APK adjunta. Antes de compilar, el flujo exige que el tag coincida
#   con el versionName de app/build.gradle.kts.
# - Manual (Actions > Android > Run workflow): mismo trabajo, pero sin publicar
#   Release. Sirve para probar el flujo sin etiquetar.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Descifrar el keystore de release
        env:
          KEYSTORE_BASE64: ${{ secrets.ENERGIA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto ENERGIA_KEYSTORE_BASE64"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/firma"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/firma/energia-release.jks"

      - name: Comprobar que el tag coincide con la version
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          VERSION_GRADLE=$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          ETIQUETA="${GITHUB_REF_NAME#v}"
          if [ "$VERSION_GRADLE" != "$ETIQUETA" ]; then
            echo "::error::El tag v$ETIQUETA no coincide con versionName=\"$VERSION_GRADLE\" de app/build.gradle.kts. Sube la version en una pull request, fusiona y vuelve a etiquetar."
            exit 1
          fi
          echo "Tag v$ETIQUETA = versionName $VERSION_GRADLE"

      - name: Compilar release firmado
        env:
          ENERGIA_KEYSTORE: ${{ runner.temp }}/firma/energia-release.jks
          ENERGIA_KEYSTORE_PASSWORD: ${{ secrets.ENERGIA_KEYSTORE_PASSWORD }}
          ENERGIA_KEY_ALIAS: ${{ secrets.ENERGIA_KEY_ALIAS }}
          ENERGIA_KEY_PASSWORD: ${{ secrets.ENERGIA_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --console=plain

      - name: Comprobar la firma
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"
          FIRMADOR=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$FIRMADOR" verify --print-certs "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: energia-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publicar la Release con la APK
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          body: |
            APK de Energía ${{ github.ref_name }}, compilada y firmada en GitHub
            Actions (R8 activado).

            Instalación: descarga el APK del release e instálalo. Android pedirá
            permitir la instalación desde esta fuente por ser una app de fuera
            de la tienda.
